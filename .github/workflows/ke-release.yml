# Added by ke: builds and publishes ke (壳) releases. Upstream herdr workflows in this directory
# only act on `master` and `v*` tags, so ke uses its own branch (`ke/main`) and tag prefix (`ke-v*`).
name: ke release

on:
  push:
    tags:
      - "ke-v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    if: github.repository != 'herdrdev/herdr'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: ke-linux-x86_64
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: ke-linux-aarch64
            smoke: false
          - target: x86_64-apple-darwin
            os: macos-latest
            name: ke-macos-x86_64
            smoke: false
          - target: aarch64-apple-darwin
            os: macos-latest
            name: ke-macos-aarch64
            smoke: true

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag matches KE_VERSION
        shell: bash
        run: |
          KE_VERSION=$(sed -n 's/^pub const KE_VERSION: &str = "\(.*\)";$/\1/p' src/build_info.rs)
          TAG_VERSION="${GITHUB_REF_NAME#ke-v}"
          if [ -z "$KE_VERSION" ] || [ "$KE_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match KE_VERSION '$KE_VERSION' in src/build_info.rs"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      # Same Zig setup as upstream release.yml; the version must match
      # vendor/libghostty-vt/build.zig.zon's minimum_zig_version.
      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ke-release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Smoke test version identity
        if: matrix.smoke
        shell: bash
        run: |
          version=$(./${{ matrix.name }} --version)
          echo "$version"
          case "$version" in
            "ke ${GITHUB_REF_NAME#ke-v} "*) ;;
            *) echo "error: unexpected version identity: $version"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    if: github.repository != 'herdrdev/herdr'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release files
        shell: bash
        run: |
          mkdir release
          cp artifacts/ke-* release/
          cp distribution/ke-install.sh release/ke-install.sh
          cp LICENSE release/LICENSE
          cd release
          sha256sum ke-linux-x86_64 ke-linux-aarch64 ke-macos-x86_64 ke-macos-aarch64 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          cat > notes.md <<EOF
          ke (壳) ${GITHUB_REF_NAME#ke-v} — a modified fork of [herdr](https://github.com/herdrdev/herdr) ${base}, licensed under Apache-2.0. ke is not herdr and is not affiliated with or endorsed by the herdr project. Every change relative to upstream is listed in [FORK.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/FORK.md).

          Install or update (macOS and Linux, x86_64 and aarch64):

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ke-install.sh | sh
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ke ${GITHUB_REF_NAME#ke-v}" \
            --notes-file notes.md
